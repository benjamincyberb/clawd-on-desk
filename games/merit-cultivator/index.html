<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; child-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Merit Cultivator</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #1a1510;
      font-family: "Songti SC", "Noto Serif SC", Georgia, serif;
      color: #f3e6c8;
      user-select: none;
    }
    #stage {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      background:
        radial-gradient(ellipse at 50% 20%, #3a2a18 0%, transparent 55%),
        linear-gradient(180deg, #1a1510 0%, #0e0b08 100%);
      cursor: pointer;
    }
    h1 {
      margin: 0;
      font-size: 28px;
      letter-spacing: 0.12em;
      font-weight: 600;
    }
    #merit {
      font-size: 48px;
      font-variant-numeric: tabular-nums;
      color: #e8c56a;
    }
    #agent {
      font-size: 14px;
      opacity: 0.75;
      letter-spacing: 0.06em;
    }
    #hint {
      font-size: 13px;
      opacity: 0.55;
      margin-top: 8px;
    }
    #ring {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      border: 3px solid rgba(232, 197, 106, 0.35);
      box-shadow: 0 0 0 0 rgba(232, 197, 106, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    #ring.working {
      border-color: #e8c56a;
      box-shadow: 0 0 28px rgba(232, 197, 106, 0.45);
      animation: pulse 1.2s ease-in-out infinite;
    }
    #ring.thinking {
      border-color: #9db0c7;
    }
    #ring.bump {
      transform: scale(1.08);
    }
    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 12px rgba(232, 197, 106, 0.25); }
      50% { box-shadow: 0 0 32px rgba(232, 197, 106, 0.55); }
    }
  </style>
</head>
<body>
  <div id="stage" title="Click to cultivate merit">
    <h1>功德修炼</h1>
    <div id="ring"><span id="merit">0</span></div>
    <div id="agent">agent: idle</div>
    <div id="hint">点击积累功德 · 存档自动保存 · Agent working 时会通知桌宠</div>
  </div>
  <script src="vendor/clawd-game-sdk.js"></script>
  <script src="main.js"></script>
</body>
</html>

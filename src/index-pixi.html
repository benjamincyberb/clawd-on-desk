<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Pixi needs worker-src blob: (Assets / basis transcoder workers). unsafe-eval is NOT required when vendor/pixi-unsafe-eval.js is loaded first. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; object-src 'self' file:; img-src 'self' file: data: blob:; media-src 'self' file:; connect-src 'self' file: data:">
  <title>Clawd (Pixi Adaptation Demo)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-user-select: none; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #pixi-stage { width: 100%; height: 100%; position: relative; overflow: hidden; }
    #pixi-stage canvas { display: block; width: 100% !important; height: 100% !important; }
    #pixi-error {
      display: none;
      position: absolute; inset: 0;
      color: #f5e6c8; background: rgba(20, 12, 8, 0.72);
      font: 12px/1.4 system-ui, sans-serif;
      padding: 12px; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="pixi-stage"></div>
  <pre id="pixi-error"></pre>
  <!-- Pixi UMD, then official strict-CSP polyfill, then spike renderer. -->
  <script src="vendor/pixi.min.js"></script>
  <script src="vendor/pixi-unsafe-eval.js"></script>
  <!-- Official Pixi mouse-trail (MeshRope) adapted for the spike -->
  <script src="pixi-mouse-trail.js"></script>
  <script src="pixi-renderer.js"></script>
</body>
</html>

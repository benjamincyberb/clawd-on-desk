<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Rive canvas-single needs wasm-unsafe-eval for WASM instantiation (WASM is inlined in vendor/rive.js). -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; object-src 'self' file:; img-src 'self' file: data:; media-src 'self' file:; connect-src 'self' file: data:">
  <title>Clawd (Rive)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-user-select: none; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #rive-stage { width: 100%; height: 100%; position: relative; overflow: hidden; }
    #rive-stage canvas { display: block; width: 100% !important; height: 100% !important; }
    #rive-badge {
      position: absolute; left: 8px; bottom: 8px; z-index: 2;
      font: 700 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #e8fff4;
      text-shadow: 0 1px 2px #061018, 0 0 1px #061018;
      pointer-events: none;
    }
    #rive-error {
      display: none;
      position: absolute; inset: 0;
      color: #f5e6c8; background: rgba(20, 12, 8, 0.72);
      font: 12px/1.4 system-ui, sans-serif;
      padding: 12px; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="rive-stage">
    <canvas id="rive-canvas" width="256" height="256"></canvas>
    <div id="rive-badge">Rive · loading…</div>
  </div>
  <pre id="rive-error"></pre>
  <script src="vendor/rive.js"></script>
  <script src="rive-renderer.js"></script>
</body>
</html>

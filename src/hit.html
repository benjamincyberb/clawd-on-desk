<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: rgba(0,0,0,0.004); }
    #hit-area { width: 100%; height: 100%; cursor: grab; }
    #hit-area.dragging { cursor: grabbing; }
    #size-edit-actions {
      position: fixed;
      z-index: 10;
      display: none;
      gap: 8px;
      align-items: center;
      justify-content: center;
      pointer-events: auto;
    }
    #size-edit-actions.visible { display: flex; }
    #size-edit-actions button {
      min-width: 72px;
      height: 30px;
      padding: 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.55);
      border-radius: 6px;
      font: 600 12px/1 system-ui, -apple-system, sans-serif;
      cursor: pointer;
      color: #f5f7fb;
      background: rgba(28, 32, 40, 0.92);
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
    }
    #size-edit-actions button:hover {
      background: rgba(48, 56, 70, 0.96);
    }
    #size-edit-confirm {
      border-color: rgba(90, 160, 255, 0.85);
      background: rgba(36, 92, 190, 0.95);
    }
    #size-edit-confirm:hover {
      background: rgba(52, 112, 220, 0.98);
    }
  </style>
</head>
<body>
  <div id="hit-area"></div>
  <div id="size-edit-actions" aria-hidden="true">
    <button type="button" id="size-edit-confirm"></button>
    <button type="button" id="size-edit-cancel"></button>
  </div>
  <script src="hit-renderer.js"></script>
</body>
</html>

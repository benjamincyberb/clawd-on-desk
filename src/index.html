<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self'; style-src 'self' 'unsafe-inline'; object-src 'self' file:; img-src 'self' file: data:; media-src 'self' file:">
  <link rel="stylesheet" href="styles.css">
  <title>Clawd</title>
</head>
<body>
  <div id="pet-clip">
    <div id="pet-container">
      <div id="pet-facing-stage">
        <div id="pet-motion-stage">
          <div id="pet-asset-direction-stage">
            <div id="pet-media-layer">
              <object id="clawd" class="clawd-object" type="image/svg+xml"></object>
            </div>
            <div id="pet-accessory-layer">
              <img id="clawd-accessory" class="clawd-accessory" alt="">
            </div>
          </div>
        </div>
      </div>
      <div id="pet-effect-stage">
        <div id="pet-particle-layer"></div>
      </div>
      <div id="merit-overlay" class="merit-overlay" hidden aria-hidden="true">
        <div class="merit-overlay-frame">
          <div class="merit-overlay-row">
            <span class="merit-stage-chip">
              <span class="merit-stage-ornament" aria-hidden="true"></span>
              <span id="merit-stage-name" class="merit-stage-name"></span>
            </span>
            <span class="merit-value-wrap">
              <span id="merit-progress-pct" class="merit-progress-pct">0%</span>
            </span>
          </div>
          <div class="merit-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div class="merit-bar-track">
              <div id="merit-bar-fill" class="merit-bar-fill">
                <span class="merit-bar-shine" aria-hidden="true"></span>
              </div>
            </div>
          </div>
        </div>
        <div id="merit-award-pop" class="merit-award-pop" aria-hidden="true"></div>
        <div id="merit-live" class="merit-live" aria-live="polite"></div>
      </div>
      <div id="merit-level-toast" class="merit-level-toast" hidden aria-hidden="true"></div>
    </div>
  </div>
  <script src="pet-accessory-layout.js"></script>
  <script src="renderer.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Phaser needs unsafe-eval for its WebGL pipeline in the desk-pet spike. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; object-src 'self' file:; img-src 'self' file: data: blob:; media-src 'self' file: blob:; connect-src 'self' file: data: blob:">
  <title>Clawd (Phaser Spike)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; outline: none; -webkit-user-select: none; user-select: none; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
    #phaser-stage { width: 100%; height: 100%; position: relative; overflow: hidden; }
    #phaser-stage canvas { display: block; width: 100% !important; height: 100% !important; background: transparent !important; }
    #phaser-badge {
      position: absolute; left: 8px; bottom: 8px; z-index: 2;
      font: 700 12px/1.2 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color: #e8fff4;
      text-shadow: 0 1px 2px #061018, 0 0 1px #061018;
      pointer-events: none;
    }
    #phaser-error {
      display: none;
      position: absolute; inset: 0;
      color: #f5e6c8; background: rgba(20, 12, 8, 0.72);
      font: 12px/1.4 system-ui, sans-serif;
      padding: 12px; white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="phaser-stage">
    <div id="phaser-badge">Phaser · loading…</div>
  </div>
  <pre id="phaser-error"></pre>
  <script src="vendor/phaser.min.js"></script>
  <script src="phaser-renderer.js"></script>
  <script src="size-edit-overlay.js"></script>
</body>
</html>
